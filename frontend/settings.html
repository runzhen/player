<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div id="app">
    <h2>Settings</h2>

    <div class="setting-group">
      <label>Lyrics Folder</label>
      <p class="setting-desc">Directory to search for .lrc lyric files</p>
      <div class="setting-row">
        <span id="lyrics-dir-path" class="path-display">Not set</span>
        <button id="btn-browse-lyrics-dir">Browse</button>
        <button id="btn-clear-lyrics-dir" class="btn-clear">Clear</button>
      </div>
    </div>

    <div class="setting-group">
      <label>Lyrics Script</label>
      <p class="setting-desc">Python script to download lyrics when not found locally</p>
      <div class="setting-row">
        <span id="lyrics-script-path" class="path-display">Not set</span>
        <button id="btn-browse-lyrics-script">Browse</button>
        <button id="btn-clear-lyrics-script" class="btn-clear">Clear</button>
      </div>
      <p class="setting-hint">Script is called with: python3 &lt;script&gt; &lt;track_path&gt; &lt;track_name&gt; &lt;save_dir&gt;</p>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
