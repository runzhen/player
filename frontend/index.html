<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQPlayer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="titlebar"></div>
    <div id="now-playing">
      <div id="track-name">No track</div>
    </div>
    <div id="progress-container">
      <span id="time-current">0:00</span>
      <div id="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <span id="time-total">0:00</span>
    </div>
    <div id="controls">
      <button id="btn-prev" title="Previous">⏮</button>
      <button id="btn-play" title="Play">⏯</button>
      <button id="btn-stop" title="Stop">⏹</button>
      <button id="btn-next" title="Next">⏭</button>
      <button id="btn-lyrics" title="Lyrics">🎤</button>
    </div>
    <div id="import-bar">
      <button id="btn-import-file">📁 Import File</button>
      <button id="btn-import-folder">📂 Import Folder</button>
    </div>
    <div id="playlist-tabs"></div>
    <div id="playlist-header">Playlist <button id="btn-mode" title="Cycle">🔁</button> <span id="playlist-count">0 tracks</span></div>
    <ul id="playlist"></ul>
  </div>
  <div id="context-menu" class="context-menu hidden">
    <div id="ctx-remove" class="context-menu-item">Remove from playlist</div>
  </div>
  <div id="close-dialog" class="dialog-overlay hidden">
    <div class="dialog-box">
      <div class="dialog-title">Close QQPlayer</div>
      <div class="dialog-text">What would you like to do?</div>
      <div class="dialog-buttons">
        <button id="btn-to-tray">Minimize to Tray</button>
        <button id="btn-quit">Quit</button>
        <button id="btn-cancel-close">Cancel</button>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
