name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build for ARM64
        run: cargo tauri build --target aarch64-apple-darwin
      - name: Build for x86_64
        run: cargo tauri build --target x86_64-apple-darwin
      - name: Ad-hoc codesign apps
        run: |
          codesign --force --deep --sign - "target/aarch64-apple-darwin/release/bundle/macos/QQPlayer.app"
          codesign --force --deep --sign - "target/x86_64-apple-darwin/release/bundle/macos/QQPlayer.app"
      - name: Create zip archives
        run: |
          cd target/aarch64-apple-darwin/release/bundle/macos
          zip -r QQPlayer-macos-arm64.zip QQPlayer.app
          cd /Users/runner/work/player/player
          cd target/x86_64-apple-darwin/release/bundle/macos
          zip -r QQPlayer-macos-x86_64.zip QQPlayer.app
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-builds
          path: |
            target/aarch64-apple-darwin/release/bundle/macos/QQPlayer-macos-arm64.zip
            target/x86_64-apple-darwin/release/bundle/macos/QQPlayer-macos-x86_64.zip
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build
        run: cargo tauri build
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: qqplayer-windows-x86_64
          path: target/release/bundle/nsis/*.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: false
      - name: Flatten artifacts for release
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.exe" \) -exec cp {} release/ \;
          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
