name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: qqplayer-macos-arm64
          path: target/aarch64-apple-darwin/release/qqplayer

  build-macos-x86:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build
        run: cargo build --release --target x86_64-apple-darwin
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: qqplayer-macos-x86_64
          path: target/x86_64-apple-darwin/release/qqplayer

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build
        run: cargo tauri build
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: qqplayer-windows-x86_64
          path: target/release/bundle/nsis/*.exe

  release:
    needs: [build-macos-arm, build-macos-x86, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: false
      - name: Flatten and rename artifacts for release
        run: |
          mkdir -p release
          cp artifacts/qqplayer-macos-arm64/qqplayer release/qqplayer-macos-arm64
          cp artifacts/qqplayer-macos-x86_64/qqplayer release/qqplayer-macos-x86_64
          find artifacts/qqplayer-windows-x86_64 -name "*.exe" -exec cp {} release/ \;
          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
